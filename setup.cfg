[options]
py_modules = polyglot
python_requires = >= 3.12
install_requires =

[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
files = polyglot.py

[ruff]
line-length = 120
target-version = py312

[tool:pytest]
testpaths = tests
addopts = -ra -q
